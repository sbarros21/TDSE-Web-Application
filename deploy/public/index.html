<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mini Web Application</title>
</head>
<body>
<h1>Mini Web Application</h1>
<img src="/images/logo.png" alt="Logo" width="120">

<hr>

<h2>Greeting service</h2>
<form id="greetingForm">
    <label for="nameInput">Name:</label>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button type="submit">Say hello</button>
</form>

<hr>

<h2>Square service</h2>
<form id="squareForm">
    <label for="numberInput">Number:</label>
    <input type="number" id="numberInput" step="any" placeholder="Enter a number">
    <button type="submit">Calculate square</button>
</form>

<hr>

<h2>Server time</h2>
<button id="timeButton">Get server time</button>

<hr>

<div id="loading" style="display:none; color: gray;">Loading...</div>
<div id="result" style="color: green; font-weight: bold;"></div>
<div id="error" style="color: red; font-weight: bold;"></div>

<script src="/js/script.js"></script>
</body>
</html>
